groups:
  - id: SC
    title: Supply Chain Security
    description: >-
      Controls related to securing the AI supply chain, including data sourcing,
      component scanning, and model provenance.

controls:
  # ── Level 1 · Supply Chain Security ──
  - id: AIGS-SC-01
    title: Secure Data Sourcing
    objective: >-
      Protect data integrity by implementing controls to detect and prevent the
      unintentional sourcing of poisoned data, with documentation and disclosure
      of these controls.
    group: SC
    state: Active
    assessment-requirements:
      - id: AIGS-SC-01.01
        text: >-
          The project MUST implement controls to detect and prevent the
          unintentional sourcing of poisoned data. Controls MUST be documented
          and disclosed.
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3

  - id: AIGS-SC-02
    title: Ethical Web Crawling
    objective: >-
      Ensure ethical data sourcing practices when web crawling is used, by
      respecting robots.txt requirements, clearly identifying the crawler,
      and disclosing web crawling activity in project documentation.
    group: SC
    state: Active
    assessment-requirements:
      - id: AIGS-SC-02.01
        text: >-
          To the extent web crawling is used to source data, web crawling activity
          MUST respect robots.txt requirements, the crawler MUST be clearly
          identified, and web crawling activity MUST be disclosed in project
          documentation.
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3

  - id: AIGS-SC-03
    title: Change Control
    objective: >-
      Establish robust change management through use of a version control system
      and a documented process for reviewing and approving changes.
    group: SC
    state: Active
    assessment-requirements:
      - id: AIGS-SC-03.01
        text: >-
          The project MUST use a version control system and have a documented
          process for reviewing and approving changes.
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3

  - id: AIGS-SC-09
    title: Tool Definition Recording
    objective: >-
      Establish tool traceability by recording a digest of each tool definition,
      and the server or source that supplied it, when the tool is approved for
      use and at each invocation.
    group: SC
    state: Active
    assessment-requirements:
      - id: AIGS-SC-09.01
        text: >-
          To the extent AI agents in the project invoke tools, the project MUST
          record a cryptographic digest of each tool definition, covering the
          complete definition as supplied, including at least its name, any
          display title, description, annotations, and input and output
          schemas, when the tool is approved for use and again at each
          invocation, and MUST retain both records. Each record MUST identify
          the server or source that supplied the tool as configured by the
          project, not as reported by that server.
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3
      - id: AIGS-SC-09.02
        text: >-
          Each record MUST state which fields the digest covers and any
          normalization applied before hashing. Normalization MUST NOT remove
          or alter any character within a field value, including invisible
          characters (e.g., zero-width, bidirectional control, and tag
          characters).
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3

  # ── Level 2 · Supply Chain Security ──
  - id: AIGS-SC-04
    title: AI Components Scanning
    objective: >-
      Secure the supply chain by scanning embedded AI components as part of development
      workflows, including CI/CD pipelines, to prevent application security risks from
      malicious or otherwise compromised components.
    group: SC
    state: Active
    assessment-requirements:
      - id: AIGS-SC-04.01
        text: >-
          Embedded AI components MUST be scanned as part of development workflows,
          including CI/CD pipelines, to prevent application security risks from
          malicious or otherwise compromised components.
        applicability:
          - maturity-2
          - maturity-3

  - id: AIGS-SC-05
    title: Training Pipeline Integrity
    objective: >-
      Ensure training pipeline integrity by documenting and securing the training pipeline
      used to produce model artifacts, including dependencies, training code, and
      environment configuration.
    group: SC
    state: Active
    assessment-requirements:
      - id: AIGS-SC-05.01
        text: >-
          The project MUST document and secure the training pipeline used to
          produce model artifacts, including dependencies, training code, and
          environment configuration.
        applicability:
          - maturity-2
          - maturity-3

  - id: AIGS-SC-06
    title: Model Provenance
    objective: >-
      Establish model traceability by maintaining provenance records linking model artifacts,
      training datasets, training code, and training parameters.
    group: SC
    state: Active
    assessment-requirements:
      - id: AIGS-SC-06.01
        text: >-
          The project MUST maintain provenance records linking model artifacts,
          training datasets, training code, and training parameters.
        applicability:
          - maturity-2
          - maturity-3

  - id: AIGS-SC-07
    title: Reproducible Builds
    objective: >-
      Enable verification through support for reproducible model builds,
      where feasible, such that independent parties can recreate the model artifacts from
      disclosed inputs.
    group: SC
    state: Active
    assessment-requirements:
      - id: AIGS-SC-07.01
        text: >-
          Where feasible, the project SHOULD support reproducible model builds
          such that independent parties can recreate the model artifacts from
          disclosed inputs.
        applicability:
          - maturity-2
          - maturity-3
        recommendation: >-
          Provide sufficient documentation and tooling for independent parties
          to reproduce model builds from disclosed inputs.

  - id: AIGS-SC-10
    title: Tool Definition Change Detection
    objective: >-
      Enable change detection by comparing each tool definition at invocation
      with the digest recorded when the tool was approved, including for a tool
      renamed so that it has no approved digest.
    group: SC
    state: Active
    assessment-requirements:
      - id: AIGS-SC-10.01
        text: >-
          Before each invocation, the project MUST compare the digest of the
          tool definition with the digest recorded when that tool was approved,
          and MUST flag any mismatch and record it with that invocation.
        applicability:
          - maturity-2
          - maturity-3
      - id: AIGS-SC-10.02
        text: >-
          A tool definition with no approved digest, supplied by a server or
          source that already has approved tool definitions, MUST be treated
          as a mismatch and MUST NOT be recorded as approved without an
          explicit approval decision.
        applicability:
          - maturity-2
          - maturity-3

  # ── Level 3 · Supply Chain Security ──
  - id: AIGS-SC-08
    title: Model Integrity
    objective: >-
      Ensure artifact integrity by signing AI models, model files, and/or other release
      artifacts with cryptographic tools and verifying them before deployment
      to prevent the introduction of untrusted components.
    group: SC
    state: Active
    assessment-requirements:
      - id: AIGS-SC-08.01
        text: >-
          The project MUST sign AI models, model files, and/or other release
          artifacts with cryptographic tools and verify them before deployment
          to prevent the introduction of untrusted components.
        applicability:
          - maturity-3

  - id: AIGS-SC-11
    title: Tool Definition Integrity
    objective: >-
      Ensure tool integrity by blocking invocation of any tool whose definition
      does not match its approved digest until the change is approved.
    group: SC
    state: Active
    assessment-requirements:
      - id: AIGS-SC-11.01
        text: >-
          Deployment environments MUST block invocation of a tool whose
          definition does not match its approved digest, including a tool
          treated as a mismatch under AIGS-SC-10.02, until the changed
          definition has been approved.
        applicability:
          - maturity-3
