groups:
  - id: GA
    title: Governance and Accountability
    description: >-
      Controls related to organizational governance, roles, policies,
      and accountability for AI projects.
  - id: SC
    title: Supply Chain Security
    description: >-
      Controls related to securing the AI supply chain, including data sourcing,
      component scanning, and model provenance.
  - id: DI
    title: Data Integrity
    description: >-
      Controls related to data governance, security, access control,
      and leakage prevention.
  - id: MR
    title: Model Robustness
    description: >-
      Controls related to adversarial testing, evaluations, and resilience
      of AI models.
  - id: DE
    title: Deployment
    description: >-
      Controls related to secure deployment, monitoring, incident response,
      and runtime safeguards.
  - id: TE
    title: Transparency and Explainability
    description: >-
      Controls related to system documentation, explainability, risk
      documentation, and incident reporting.
controls:
  # ── Level 1 · Governance and Accountability ──
  - id: AIGS-GA-01
    title: Contributor Roles and Responsibilities
    objective: >-
      Establish clear documentation of roles and responsibilities for maintainers
      and contributors throughout the AI project lifecycle from development to
      deployment and ongoing monitoring.
    group: GA
    assessment-requirements:
      - id: AIGS-GA-01-01
        text: |
          The project MUST document the roles and responsibilities for maintainers
          and contributors to the AI project lifecycle from development to
          deployment and ongoing monitoring.
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3
    state: Active

  - id: AIGS-GA-02
    title: Model Governance
    objective: >-
      Ensure transparency through written, documented disclosure of AI models
      ingested in, called, or otherwise used in the development or deployment
      of the open source AI project.
    group: GA
    state: Active
    assessment-requirements:
      - id: AIGS-GA-02-01
        title: Minimum Model Disclosure Requirements
        text: >-
          Minimum disclosure requirements MUST include the model name, developer,
          release date, license, model description, deployment status (as
          necessary), and URL to the open source model repository (if available)
          or model release announcement.
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3

  - id: AIGS-GA-03
    title: Data Governance
    objective: >-
      Achieve transparency by disclosing datasets ingested in or otherwise used in the
      development or deployment of the open source AI project, including
      datasets used for training, testing, and validation.
    group: GA
    state: Active
    assessment-requirements:
      - id: AIGS-GA-03-01
        title: Minimum Dataset Disclosure Requirements
        text: >-
          Minimum disclosure requirements for each dataset MUST include the name,
          country of origin, license, description, data processing (if any), and
          public URL (if available).
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3

  - id: AIGS-GA-04
    title: Licensing
    objective: >-
      Establish clear licensing by specifying a license for the model weights
      and model files while the project is active.
    group: GA
    state: Active
    assessment-requirements:
      - id: AIGS-GA-04-01
        text: >-
          While active, the project MUST specify a license for the model weights
          and model files.
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3

  - id: AIGS-GA-05
    title: Ethics and Intended Use
    objective: >-
      Define and document the intended use of the open source
      AI project, including the ethical principles that guide open source AI
      project development and deployment.
    group: GA
    state: Active
    assessment-requirements:
      - id: AIGS-GA-05-01
        text: >-
          The project MUST define and document the intended use of the open source
          AI project, including the ethical principles that guide open source AI
          project development and deployment.
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3

  - id: AIGS-GA-06
    title: Project Inventory
    objective: >-
      Maintain comprehensive visibility through an inventory of components, tooling, systems
      and applications, disclosed within the README of the repository where the
      project is made available.
    group: GA
    state: Active
    assessment-requirements:
      - id: AIGS-GA-06-01
        text: >-
          The project MUST maintain an inventory of its components, tooling, systems
          and applications, disclosed within the README of the repository where the
          project is made available.
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3

  # ── Level 1 · Supply Chain Security ──
  - id: AIGS-SC-01
    title: Secure Data Sourcing
    objective: >-
      Protect data integrity by implementing controls to detect and prevent the
      unintentional sourcing of poisoned data, with documentation and disclosure
      of these controls.
    group: SC
    state: Active
    assessment-requirements:
      - id: AIGS-SC-01-01
        text: >-
          The project MUST implement controls to detect and prevent the
          unintentional sourcing of poisoned data. Controls MUST be documented
          and disclosed.
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3

  - id: AIGS-SC-02
    title: Ethical Web Crawling
    objective: >-
      Ensure ethical data sourcing practices when web crawling is used, by
      respecting robots.txt requirements, clearly identifying the crawler,
      and disclosing web crawling activity in project documentation.
    group: SC
    state: Active
    assessment-requirements:
      - id: AIGS-SC-02-01
        text: >-
          To the extent web crawling is used to source data, web crawling activity
          MUST respect robots.txt requirements, the crawler MUST be clearly
          identified, and web crawling activity MUST be disclosed in project
          documentation.
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3

  - id: AIGS-SC-03
    title: Change Control
    objective: >-
      Establish robust change management through use of a version control system
      and a documented process for reviewing and approving changes.
    group: SC
    state: Active
    assessment-requirements:
      - id: AIGS-SC-03-01
        text: >-
          The project MUST use a version control system and have a documented
          process for reviewing and approving changes.
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3

  # ── Level 1 · Data Integrity ──
  - id: AIGS-DI-01
    title: Enforceable Data Policy
    objective: >-
      Maintain data provenance by tracking the origin and lineage of all data
      used for training and testing AI models.
    group: DI
    state: Active
    assessment-requirements:
      - id: AIGS-DI-01-01
        text: >-
          Track the origin and lineage of all data used for training and testing
          AI models.
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3

  - id: AIGS-DI-02
    title: Data Security
    objective: >-
      Protect data through implementation of robust security controls to ensure
      confidentiality, integrity, and availability.
    group: DI
    state: Active
    assessment-requirements:
      - id: AIGS-DI-02-01
        title: Minimum Data Security Requirements
        text: >-
          Minimum data security requirements MUST include authentication
          and authorization.
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3

  - id: AIGS-DI-03
    title: Data Least Privilege Access
    objective: >-
      Implement secure access management through clearly documented data access
      controls that follow the principles of least privilege.
    group: DI
    state: Active
    assessment-requirements:
      - id: AIGS-DI-03-01
        text: >-
          Data access controls MUST be clearly documented and follow the
          principles of least privilege access.
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3

  - id: AIGS-DI-04
    title: Sensitive and Copyright Data Leakage Prevention
    objective: >-
      Prevent data leakage by implementing controls and testing to avoid
      inadvertently revealing sensitive information (e.g., PII, proprietary
      data) from the training set.
    group: DI
    state: Active
    assessment-requirements:
      - id: AIGS-DI-04-01
        text: >-
          The project MUST implement controls and testing to prevent the project
          from inadvertently revealing sensitive information (e.g., PII, proprietary
          data) from its training set.
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3

  # ── Level 1 · Model Robustness ──
  - id: AIGS-MR-01
    title: Model Robustness
    objective: >-
      Strengthen model resilience through red teaming to screen for vulnerabilities
      to adversarial attacks, including prompt injection attacks.
    group: MR
    state: Active
    assessment-requirements:
      - id: AIGS-MR-01-01
        title: Model Robustness Disclosures
        text: >-
          To the extent possible, the project owner SHOULD disclose red teaming
          methodology and sufficient detail to satisfy downstream users of the
          model's robustness to a diverse set of adversarial attacks under
          deployment-like conditions.
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3
        recommendation: >-
          Publish red teaming methodology and results with sufficient detail
          to inform downstream users about adversarial robustness.

  - id: AIGS-MR-02
    title: Evaluations
    objective: >-
      Validate model performance and security prior to deployment by testing against
      publicly available or manually-created, task-specific benchmarks to evaluate,
      quantify, and validate the resilience of the AI project against common
      vulnerabilities.
    group: MR
    state: Active
    assessment-requirements:
      - id: AIGS-MR-02-01
        title: Evaluations Disclosures
        text: >-
          To the extent possible, the project owner SHOULD disclose evaluation
          results and sufficient detail to satisfy downstream users of the
          model's reliability under a diverse set of deployment-like conditions
          and tasks.
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3
        recommendation: >-
          Publish evaluation results and methodology to inform downstream
          users about model reliability under deployment-like conditions.

  # ── Level 1 · Deployment ──
  - id: AIGS-DE-01
    title: Guardrails
    objective: >-
      Mitigate deployment risks by implementing guardrails to address identified risks,
      with minimum coverage for prompt injection attacks (input).
    group: DE
    state: Active
    assessment-requirements:
      - id: AIGS-DE-01-01
        text: >-
          The project MUST implement guardrails to mitigate identified risks, and
          at a minimum, implement guardrails to mitigate against prompt injection
          attacks (input).
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3

  - id: AIGS-DE-02
    title: Vulnerability Disclosure Mechanism
    objective: >-
      Enable responsible disclosure by establishing a defined communication channel
      or mechanism through which vulnerabilities and other security-related information
      may be disclosed to project contributors and maintainers.
    group: DE
    state: Active
    assessment-requirements:
      - id: AIGS-DE-02-01
        text: >-
          The project MUST have a defined communication channel or mechanism
          through which vulnerabilities and other security-related information
          MAY be disclosed to the project contributors and maintainers.
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3

  - id: AIGS-DE-03
    title: Insecure Output Handling
    objective: >-
      Prevent downstream vulnerabilities by validating and sanitizing model outputs.
    group: DE
    state: Active
    assessment-requirements:
      - id: AIGS-DE-03-01
        text: >-
          The project MUST validate and sanitize model outputs to prevent
          downstream vulnerabilities.
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3

  # ── Level 1 · Transparency and Explainability ──
  - id: AIGS-TE-01
    title: Explainability
    objective: >-
      Enhance understanding by providing explanations for design
      decisions that affect project performance and security, where feasible.
    group: TE
    state: Active
    assessment-requirements:
      - id: AIGS-TE-01-01
        text: >-
          Where feasible, the project MUST provide explanations for design
          decisions that affect project performance and security.
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3

  - id: AIGS-TE-02
    title: System Documentation
    objective: >-
      Ensure system transparency through clear and comprehensive documentation
      of the AI system, including its intended use, limitations, and
      potential risks.
    group: TE
    state: Active
    assessment-requirements:
      - id: AIGS-TE-02-01
        text: >-
          Project contributors MUST maintain clear and comprehensive documentation
          for the AI system, including its intended use, limitations, and
          potential risks.
        applicability:
          - maturity-1
          - maturity-2
          - maturity-3

  # ── Level 2 · Governance and Accountability ──
  - id: AIGS-GA-07
    title: AI Policy
    objective: >-
      Establish governance framework by defining an AI policy with principles that guide all
      activities of the organization related to AI and processes for handling
      deviations and exceptions to policy.
    group: GA
    state: Active
    assessment-requirements:
      - id: AIGS-GA-07-01
        title: AI Policy Requirements
        text: >-
          The AI policy SHOULD consider topic-specific aspects where necessary
          to provide additional guidance or provide cross-references to other
          security and governance policies dealing with these core aspects:
          AI resources and assets, AI system impact assessment scope, and AI
          project secure development.
        applicability:
          - maturity-2
          - maturity-3
        recommendation: >-
          Address AI resources and assets, AI system impact assessment scope,
          and AI project secure development in the AI policy or through
          cross-references to related policies.

  # ── Level 2 · Supply Chain Security ──
  - id: AIGS-SC-04
    title: AI Components Scanning
    objective: >-
      Secure the supply chain by scanning embedded AI components as part of development
      workflows, including CI/CD pipelines, to prevent application security risks from
      malicious or otherwise compromised components.
    group: SC
    state: Active
    assessment-requirements:
      - id: AIGS-SC-04-01
        text: >-
          Embedded AI components MUST be scanned as part of development workflows,
          including CI/CD pipelines, to prevent application security risks from
          malicious or otherwise compromised components.
        applicability:
          - maturity-2
          - maturity-3

  - id: AIGS-SC-05
    title: Training Pipeline Integrity
    objective: >-
      Ensure training pipeline integrity by documenting and securing the training pipeline
      used to produce model artifacts, including dependencies, training code, and
      environment configuration.
    group: SC
    state: Active
    assessment-requirements:
      - id: AIGS-SC-05-01
        text: >-
          The project MUST document and secure the training pipeline used to
          produce model artifacts, including dependencies, training code, and
          environment configuration.
        applicability:
          - maturity-2
          - maturity-3

  - id: AIGS-SC-06
    title: Model Provenance
    objective: >-
      Establish model traceability by maintaining provenance records linking model artifacts,
      training datasets, training code, and training parameters.
    group: SC
    state: Active
    assessment-requirements:
      - id: AIGS-SC-06-01
        text: >-
          The project MUST maintain provenance records linking model artifacts,
          training datasets, training code, and training parameters.
        applicability:
          - maturity-2
          - maturity-3

  - id: AIGS-SC-07
    title: Reproducible Builds
    objective: >-
      Enable verification through support for reproducible model builds,
      where feasible, such that independent parties can recreate the model artifacts from
      disclosed inputs.
    group: SC
    state: Active
    assessment-requirements:
      - id: AIGS-SC-07-01
        text: >-
          Where feasible, the project SHOULD support reproducible model builds
          such that independent parties can recreate the model artifacts from
          disclosed inputs.
        applicability:
          - maturity-2
          - maturity-3
        recommendation: >-
          Provide sufficient documentation and tooling for independent parties
          to reproduce model builds from disclosed inputs.

  # ── Level 2 · Data Integrity ──
  - id: AIGS-DI-05
    title: Dataset Cataloguing
    objective: >-
      Maintain dataset traceability by tracking and versioning datasets
      used for training and evaluation to ensure reproducibility.
    group: DI
    state: Active
    assessment-requirements:
      - id: AIGS-DI-05-01
        text: >-
          Datasets used for training and evaluation MUST be tracked and versioned
          to ensure traceability and reproducibility.
        applicability:
          - maturity-2
          - maturity-3

  - id: AIGS-DI-06
    title: Dataset Risk Assessment
    objective: >-
      Mitigate dataset risks by assessing datasets for, at a minimum, legal and copyright
      risk, licensing compatibility with project intended use, and security
      risks (e.g., data poisoning, PII/SPI).
    group: DI
    state: Active
    assessment-requirements:
      - id: AIGS-DI-06-01
        text: >-
          The project MUST assess datasets for, at a minimum, legal and copyright
          risk, licensing compatibility with project intended use, and security
          risks (e.g., data poisoning, PII/SPI).
        applicability:
          - maturity-2
          - maturity-3

  - id: AIGS-DI-07
    title: Data Risk Minimization
    objective: >-
      Minimize data exposure by implementing controls to limit the use of unnecessary
      or high-risk data.
    group: DI
    state: Active
    assessment-requirements:
      - id: AIGS-DI-07-01
        text: >-
          The project MUST implement controls to limit the use of unnecessary
          or high-risk data.
        applicability:
          - maturity-2
          - maturity-3

  # ── Level 2 · Model Robustness ──
  - id: AIGS-MR-03
    title: Continuous Testing
    objective: >-
      Maintain ongoing security assurance by continuously implementing red teaming and
      evaluations prior to pushing system updates or model re-training into production.
    group: MR
    state: Active
    assessment-requirements:
      - id: AIGS-MR-03-01
        text: >-
          The project MUST continuously implement red teaming and evaluations
          prior to pushing system updates or model re-training into production.
        applicability:
          - maturity-2
          - maturity-3

  - id: AIGS-MR-04
    title: Regression Testing
    objective: >-
      Preserve security posture by maintaining regression tests for safety and security
      behaviors to prevent regression during updates.
    group: MR
    state: Active
    assessment-requirements:
      - id: AIGS-MR-04-01
        text: >-
          The project MUST maintain regression tests for safety and security
          behaviors to prevent regression during updates.
        applicability:
          - maturity-2
          - maturity-3

  - id: AIGS-MR-05
    title: Evaluation Coverage
    objective: >-
      Provide testing transparency by documenting the scope and limitations of testing.
    group: MR
    state: Active
    assessment-requirements:
      - id: AIGS-MR-05-01
        text: >-
          The project MUST document the scope and limitations of testing.
        applicability:
          - maturity-2
          - maturity-3

  # ── Level 2 · Deployment ──
  - id: AIGS-DE-04
    title: Deployment Infrastructure
    objective: >-
      Secure deployment infrastructure by ensuring access to models, tools and tool calling
      functionality, and general deployment scaffolding or infrastructure follows
      least-privilege principles.
    group: DE
    state: Active
    assessment-requirements:
      - id: AIGS-DE-04-01
        text: >-
          Access to models, tools and tool calling functionality, and general
          deployment scaffolding or infrastructure MUST follow least-privilege
          principles.
        applicability:
          - maturity-2
          - maturity-3

  - id: AIGS-DE-05
    title: Logging and Monitoring
    objective: >-
      Enable threat detection by implementing logging and monitoring for deployment
      environments, including tool use, to detect misuse or anomalies.
    group: DE
    state: Active
    assessment-requirements:
      - id: AIGS-DE-05-01
        text: >-
          The project MUST implement logging and monitoring for deployment
          environments, including tool use, to detect misuse or anomalies.
        applicability:
          - maturity-2
          - maturity-3

  - id: AIGS-DE-06
    title: Incident Response Procedures
    objective: >-
      Establish incident response capability by defining procedures for responding to
      security incidents involving the AI project in a timely manner.
    group: DE
    state: Active
    assessment-requirements:
      - id: AIGS-DE-06-01
        text: >-
          The project MUST define procedures for responding to security incidents
          involving the AI project in a timely manner.
        applicability:
          - maturity-2
          - maturity-3

  - id: AIGS-DE-07
    title: Project Maintenance
    objective: >-
      Ensure sustainable maintenance by documenting processes for releasing model updates
      and security patches.
    group: DE
    state: Active
    assessment-requirements:
      - id: AIGS-DE-07-01
        text: >-
          The project MUST document processes for releasing model updates and
          security patches.
        applicability:
          - maturity-2
          - maturity-3

  # ── Level 3 · Governance and Accountability ──
  - id: AIGS-GA-08
    title: Regulatory Compliance
    objective: >-
      Demonstrate regulatory awareness by disclosing compliance status to the extent
      the open source AI project meets regulatory requirements and standards for the
      deployment of AI models and systems.
    group: GA
    state: Active
    assessment-requirements:
      - id: AIGS-GA-08-01
        text: >-
          To the extent the open source AI project meets regulatory requirements
          and standards for the deployment of AI models and systems, the project
          MUST disclose (non-)compliance.
        applicability:
          - maturity-3

  - id: AIGS-GA-09
    title: AI Bill of Materials
    objective: >-
      Enable downstream risk management by making structured disclosures of relevant
      model and data metadata available in machine-readable format while the project
      is active, to inform downstream risk-based controls.
    group: GA
    state: Active
    assessment-requirements:
      - id: AIGS-GA-09-01
        text: >-
          While active, structured disclosures of relevant model and data metadata
          relevant to AI project development and deployment MUST be made available
          in machine-readable format to inform downstream risk-based controls.
        applicability:
          - maturity-3

  # ── Level 3 · Supply Chain Security ──
  - id: AIGS-SC-08
    title: Model Integrity
    objective: >-
      Ensure artifact integrity by signing AI models, model files, and/or other release
      artifacts with cryptographic tools and verifying them before deployment
      to prevent the introduction of untrusted components.
    group: SC
    state: Active
    assessment-requirements:
      - id: AIGS-SC-08-01
        text: >-
          The project MUST sign AI models, model files, and/or other release
          artifacts with cryptographic tools and verify them before deployment
          to prevent the introduction of untrusted components.
        applicability:
          - maturity-3

  # ── Level 3 · Data Integrity ──
  - id: AIGS-DI-08
    title: Full Audit Logging
    objective: >-
      Maintain comprehensive audit trail by logging read or write access to data,
      with timestamp, user id, action performed (read/write), and dataset id and
      version(s) accessed.
    group: DI
    state: Active
    assessment-requirements:
      - id: AIGS-DI-08-01
        text: >-
          Read or write access to data MUST be logged, with timestamp, user id,
          action performed (read/write), and dataset id and version(s) accessed.
        applicability:
          - maturity-3

  # ── Level 3 · Model Robustness ──
  - id: AIGS-MR-06
    title: Third-Party Red Teaming
    objective: >-
      Validate security through independent testing for adversarial robustness
      from trusted third-parties.
    group: MR
    state: Active
    assessment-requirements:
      - id: AIGS-MR-06-01
        text: >-
          The project MUST conduct or commission independent testing for
          adversarial robustness from trusted third-parties.
        applicability:
          - maturity-3

  - id: AIGS-MR-07
    title: Robustness Benchmark Testing
    objective: >-
      Ensure ongoing robustness by evaluating models used in the AI project at runtime
      against an evolving suite of standardized robustness benchmarks.
    group: MR
    state: Active
    assessment-requirements:
      - id: AIGS-MR-07-01
        text: >-
          The project MUST evaluate models used in the AI project at runtime
          against an evolving suite of standardized robustness benchmarks.
        applicability:
          - maturity-3

  # ── Level 3 · Deployment ──
  - id: AIGS-DE-08
    title: Runtime Safeguards
    objective: >-
      Protect production systems by including runtime safeguards in deployment environments
      for detecting and mitigating malicious inputs and outputs and unexpected or
      unauthorized system-level behavior.
    group: DE
    state: Active
    assessment-requirements:
      - id: AIGS-DE-08-01
        text: >-
          Deployment environments MUST include runtime safeguards for detecting
          and mitigating malicious inputs and outputs and unexpected or
          unauthorized system-level behavior.
        applicability:
          - maturity-3

  - id: AIGS-DE-09
    title: Kill Switch
    objective: >-
      Enable emergency response by implementing a security mechanism designed to
      immediately halt, disable, or contain an AI project if it is believed to behave
      in dangerous or unpredictable ways causing harm.
    group: DE
    state: Active
    assessment-requirements:
      - id: AIGS-DE-09-01
        text: >-
          The project MUST implement a security mechanism designed to immediately
          halt, disable, or contain an AI project if it is believed to behave
          in dangerous or unpredictable ways causing harm.
        applicability:
          - maturity-3

  # ── Level 3 · Transparency and Explainability ──
  - id: AIGS-TE-03
    title: Residual Risk Documentation
    objective: >-
      Promote informed decision-making by documenting residual risks and known limitations
      of safeguards.
    group: TE
    state: Active
    assessment-requirements:
      - id: AIGS-TE-03-01
        text: >-
          The project MUST document residual risks and known limitations
          of safeguards.
        applicability:
          - maturity-3

  - id: AIGS-TE-04
    title: Security Incident Reporting
    objective: >-
      Foster transparency and learning by maintaining a public record of safety and security
      incidents and ex post mitigations.
    group: TE
    state: Active
    assessment-requirements:
      - id: AIGS-TE-04-01
        text: >-
          The project MUST maintain a public record of safety and security
          incidents and ex post mitigations.
        applicability:
          - maturity-3
